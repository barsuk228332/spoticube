name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Проверка синтаксиса
        run: python -m compileall -q main.py spoticube tools tests

      - name: Тесты
        run: python -m pytest -q

      - name: Системные библиотеки для Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Smoke-тест импортов (без дисплея)
        run: |
          QT_QPA_PLATFORM=offscreen python - <<'PY'
          from PySide6.QtWidgets import QApplication
          from spoticube.ui.main_window import MainWindow
          from spoticube.ui.theme import apply_theme

          app = QApplication([])
          apply_theme(app)
          window = MainWindow()
          assert window.windowTitle()
          print("UI собирается:", window.windowTitle())
          PY
